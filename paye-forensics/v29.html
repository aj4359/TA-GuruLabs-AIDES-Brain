<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v29</title><style>body{margin:0;background:#0b0b0d;color:#f5f1e8;font:16px system-ui}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pill,button{border:1px solid #4b473f;border-radius:999px;padding:8px 12px;background:#151419;color:#f5f1e8}button.active{background:#c6a15b;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card,.tax-scene{border:1px solid #343138;border-radius:18px;padding:18px;background:#121216;margin:14px 0}.tax-scene svg{width:100%;height:auto}.scene-no{font-size:12px;opacity:.6}.muted{opacity:.7}input,select{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #454148;background:#0d0d10;color:#fff;margin-top:5px}.gold{color:#c6a15b}</style></head><body><main class="wrap"><div class="top"><div><span class="pill">PAYE FORENSICS v29</span><h1>See what your tax is <span class="gold">doing</span>.</h1></div><div id="levels"><button data-level="SIMPLE" class="active">Simple</button><button data-level="NORMAL">Normal</button><button data-level="ADVISER">Adviser</button></div></div><p class="muted">One calculation. One evidence trail. Different ways to understand it.</p><section class="card"><h2>Tell us what is happening</h2><div class="grid"><label>Income £<input id="income" type="number" value="30000"></label><label>Tax deducted £<input id="deducted" type="number" value="2600"></label><label>Tax due in reconstruction £<input id="due" type="number" value="3400"></label><label>Tax code<input id="code" value="K154 M1"></label><label>HMRC IYA £<input id="iya" type="number" value="640"></label><label>HMRC underpayment £<input id="under" type="number" value="800"></label><label>Active PAYE sources<input id="sources" type="number" value="1"></label><label>Started new job?<select id="newjob"><option value="no">No</option><option value="yes">Yes</option></select></label></div><button id="run">Build my tax story</button></section><section id="route" class="card"></section><section id="story"></section></main><script type="module">import{choosePayeJourney}from'./app-router-v29.js';import{compileTaxVisualStory}from'./tax-visual-engine-v27.js';import{renderStoryHtml}from'./visual-renderer-v29.js';let level='SIMPLE';document.querySelectorAll('#levels button').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('#levels button').forEach(x=>x.classList.toggle('active',x===b));run();});function run(){const taxCode=code.value;const facts={incomeTotal:+income.value,taxDeducted:+deducted.value,taxDue:+due.value,underpayment:+under.value,hmrcUnderpayment:+under.value,taxCode,iyaAmount:+iya.value,activePayeSources:+sources.value,startedNewJob:newjob.value==='yes',hasBeenPaid:newjob.value==='yes'};const r=choosePayeJourney(facts);route.innerHTML=`<h2>${r.customerPrompt}</h2><p><b>Journey:</b> ${r.primaryJourney.replaceAll('_',' ')}</p><p class="muted">Modules: ${r.modules.join(' • ')||'Tax code check'}</p>`;const c=compileTaxVisualStory({incomeTotal:facts.incomeTotal,personalAllowance:12570,taxDue:facts.taxDue,taxDeducted:facts.taxDeducted,underpayment:facts.underpayment,kCode:/K\d+/i.test(taxCode)?taxCode:null,iyaAmount:facts.iyaAmount,allowanceCollision:facts.activePayeSources>1},{languageLevel:level});story.innerHTML=renderStoryHtml(c);}run();</script></body></html>
