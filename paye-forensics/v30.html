<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v30</title><style>:root{font-size:16px}body{margin:0;background:#0b0b0d;color:#f5f1e8;font-family:system-ui,-apple-system,sans-serif;line-height:1.45}.wrap{max-width:1080px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.pill,button{border:1px solid #4b473f;border-radius:999px;padding:9px 13px;background:#151419;color:#f5f1e8}button{cursor:pointer}button.active{background:#c6a15b;color:#111;border-color:#c6a15b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card,.tax-scene{border:1px solid #343138;border-radius:18px;padding:18px;background:#121216;margin:14px 0}.tax-scene svg{width:100%;height:auto}.muted{opacity:.72}.gold{color:#c6a15b}.scene-no{font-size:12px;opacity:.6}input,select{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #454148;background:#0d0d10;color:#fff;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.metric{border:1px solid #343138;border-radius:14px;padding:14px}.metric b{font-size:1.35rem}.notice{border-left:4px solid #c6a15b;padding-left:12px}.highcontrast{background:#000;color:#fff}.large{font-size:20px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="wrap"><div class="top"><div><span class="pill">PAYE FORENSICS v30</span><h1>See what your tax is <span class="gold">doing</span>.</h1><p class="muted">Real deterministic calculation → evidence-labelled visual story.</p></div><div><div id="levels" class="toolbar"><button data-level="SIMPLE" class="active">Simple</button><button data-level="NORMAL">Normal</button><button data-level="ADVISER">Adviser</button></div><div class="toolbar" style="margin-top:8px"><button id="bigText">Large text</button><button id="contrast">High contrast</button><button id="read">Read aloud</button></div></div></div><section class="card"><h2>Tell us about your tax picture</h2><div class="grid"><label>Jurisdiction<select id="jurisdiction"><option>England & Northern Ireland</option><option>Scotland</option><option>Wales</option></select></label><label>Employment income £<input id="employment" type="number" value="30000"></label><label>Second job income £<input id="secondJob" type="number" value="0"></label><label>Private pension £<input id="privatePension" type="number" value="0"></label><label>State Pension £<input id="statePension" type="number" value="0"></label><label>Taxable benefits £<input id="benefits" type="number" value="0"></label><label>Untaxed savings interest £<input id="interest" type="number" value="0"></label><label>Dividends £<input id="dividends" type="number" value="0"></label><label>Tax already deducted £<input id="deducted" type="number" value="2600"></label><label>HMRC underpayment £<input id="hmrcUnder" type="number" value="800"></label><label>Previous tax code<input id="oldCode" value="1257L"></label><label>Current tax code<input id="newCode" value="K154 M1"></label><label>HMRC IYA £<input id="iya" type="number" value="640"></label><label>Remaining pay periods<input id="periods" type="number" value="8"></label><label>Started a new job?<select id="started"><option value="no">No</option><option value="yes">Yes</option></select></label><label>Number of active PAYE sources<input id="sourceCount" type="number" min="1" value="1"></label></div><button id="run" style="margin-top:14px">Build my tax story</button></section><section id="route" class="card"></section><section id="summary" class="card"></section><section id="story"></section><section class="card notice"><b>Important:</b> this is an explanatory reconstruction from the facts you provide. It does not issue tax codes or reproduce HMRC's internal NPS calculation.</section></main><script src="../prototypes/paye-forensics/rules-2026-27.js"></script><script src="../prototypes/paye-forensics/engine-v2.js"></script><script type="module">import{choosePayeJourney}from'./app-router-v29.js';import{buildUnifiedTaxVisualCase}from'./unified-visual-adapter-v28.js';import{renderStoryHtml}from'./visual-renderer-v29.js';let level='SIMPLE';const $=id=>document.getElementById(id);const money=n=>'£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});function input(){const count=Math.max(1,+$('sourceCount').value||1);const activeSources=Array.from({length:count},(_,i)=>({id:`src-${i+1}`,label:`PAYE source ${i+1}`,income:i===0?+$('employment').value:+$('secondJob').value,taxCode:i===0?$('newCode').value:(count>1?'1257L':'')}));return{calc:{jurisdiction:$('jurisdiction').value,employmentIncome:+$('employment').value,secondJobIncome:+$('secondJob').value,privatePension:+$('privatePension').value,statePension:+$('statePension').value,benefitsInKind:+$('benefits').value,otherNonSavings:0,savingsInterest:+$('interest').value,isaIncome:0,dividends:+$('dividends').value,taxAlreadyDeducted:+$('deducted').value,hmrcStatedUnderpayment:+$('hmrcUnder').value,oldTaxCode:$('oldCode').value,newTaxCode:$('newCode').value,remainingPayPeriods:+$('periods').value},facts:{startedNewJob:$('started').value==='yes',hasBeenPaid:$('started').value==='yes',activePayeSources:count,taxCode:$('newCode').value,hmrcUnderpayment:+$('hmrcUnder').value,iyaAmount:+$('iya').value},activeSources};}function run(){try{const x=input();const route=choosePayeJourney({...x.facts,hasPensions:(+privatePension.value+ +statePension.value)>0,hasSavings:+interest.value>0});$('route').innerHTML=`<h2>${route.customerPrompt}</h2><p><b>Journey:</b> ${route.primaryJourney.replaceAll('_',' ')}</p><p class="muted">Modules: ${route.modules.join(' • ')||'Core tax check'}</p>`;const pensions=[];if(+privatePension.value>0)pensions.push({label:'Private pension',annualIncome:+privatePension.value,taxCode:newCode.value});const result=buildUnifiedTaxVisualCase(x.calc,{languageLevel:level,taxCode:newCode.value,iyaAmount:+iya.value,previousYearUnderpayment:0,includePensionerSplit:pensions.length>0||+statePension.value>0,pensions,activeSources:x.activeSources});const c=result.deterministicResult;$('summary').innerHTML=`<h2>Your reconstructed position</h2><div class="summary"><div class="metric"><span class="muted">Income in calculation</span><br><b>${money(c.nonSavingsGross+c.savingsGross+c.dividendsGross)}</b></div><div class="metric"><span class="muted">Personal Allowance</span><br><b>${money(c.personalAllowance)}</b></div><div class="metric"><span class="muted">Tax due</span><br><b>${money(c.taxDue)}</b></div><div class="metric"><span class="muted">Tax deducted</span><br><b>${money(c.taxAlreadyDeducted)}</b></div><div class="metric"><span class="muted">Possible underpayment</span><br><b>${money(c.reconstructedUnderpayment)}</b></div><div class="metric"><span class="muted">HMRC figure difference</span><br><b>${money(c.difference)}</b><br><small>${c.confidence}</small></div></div>`;$('story').innerHTML=renderStoryHtml(result.visualStory);window.__PAYE_V30_LAST=result;}catch(e){$('story').innerHTML=`<section class="card"><h2>We could not build the story</h2><p>${e.message}</p></section>`;}}document.querySelectorAll('#levels button').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('#levels button').forEach(x=>x.classList.toggle('active',x===b));run();});$('run').onclick=run;$('bigText').onclick=()=>document.body.classList.toggle('large');$('contrast').onclick=()=>document.body.classList.toggle('highcontrast');$('read').onclick=()=>{speechSynthesis.cancel();const text=[...document.querySelectorAll('#route h2,#summary h2,#summary .metric,.tax-scene h2,.tax-scene p')].map(x=>x.innerText).join('. ');if(text)speechSynthesis.speak(new SpeechSynthesisUtterance(text));};run();</script></body></html>
