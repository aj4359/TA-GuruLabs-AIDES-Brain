<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v28 | Unified Tax Visual Engine</title><style>body{margin:0;background:#0b0b0d;color:#f6f1e8;font:16px system-ui}.wrap{max-width:1040px;margin:auto;padding:26px}.card{background:#121216;border:1px solid #343238;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.gold{color:#c6a15b}.pill{display:inline-block;border:1px solid #555;border-radius:999px;padding:5px 9px;font-size:12px}.scene{border-left:4px solid #c6a15b}.muted{color:#b9b4aa}input,select{width:100%;box-sizing:border-box;background:#0b0b0d;color:white;border:1px solid #555;border-radius:9px;padding:9px;margin-top:5px}button{background:#c6a15b;border:0;border-radius:10px;padding:11px 14px;font-weight:800;margin-right:8px}.big{font-size:clamp(32px,6vw,64px);font-weight:800}</style></head><body><main class="wrap"><span class="pill">PAYE FORENSICS v28</span><h1>One calculation. <span class="gold">Three ways to understand it.</span></h1><p class="muted">This page now uses the real deterministic PAYE engine, then feeds that result into the Tax Visual Engine.</p><section class="grid"><div class="card"><label>Employment income £<input id="employment" type="number" value="26000"></label><label>State Pension £<input id="statePension" type="number" value="0"></label><label>Savings interest £<input id="interest" type="number" value="1200"></label></div><div class="card"><label>Tax already deducted £<input id="deducted" type="number" value="2600"></label><label>HMRC stated underpayment £<input id="hmrc" type="number" value="640"></label><label>Tax code<input id="code" value="1257L"></label></div><div class="card"><label>Language<select id="lang"><option>SIMPLE</option><option selected>NORMAL</option><option>ADVISER</option></select></label><label>IYA amount £<input id="iya" type="number" value="0"></label><label>Remaining pay periods<input id="periods" type="number" value="6"></label></div></section><button id="run">Build visual story</button><div id="out"></div></main><script src="../prototypes/paye-forensics/rules-2026-27.js"></script><script src="../prototypes/paye-forensics/engine-v2.js"></script><script type="module">import{buildUnifiedTaxVisualCase}from'./unified-visual-adapter-v28.js';const $=id=>document.getElementById(id),money=n=>'£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});function render(){const r=buildUnifiedTaxVisualCase({employmentIncome:+$('employment').value,statePension:+$('statePension').value,savingsInterest:+$('interest').value,taxAlreadyDeducted:+$('deducted').value,hmrcStatedUnderpayment:+$('hmrc').value,newTaxCode:$('code').value,remainingPayPeriods:+$('periods').value,jurisdiction:'England & Northern Ireland'},{languageLevel:$('lang').value,taxCode:$('code').value,iyaAmount:+$('iya').value});$('out').innerHTML=`<section class="card"><span class="pill">RECONCILIATION</span><div class="big">${money(r.reconciliation.reconstructedUnderpayment)}</div><p>Possible reconstructed underpayment</p><p>HMRC says ${money(r.reconciliation.hmrcStatedUnderpayment)} · difference ${money(r.reconciliation.difference)} · ${r.reconciliation.confidence}</p></section>`+r.visualStory.scenes.map(s=>`<section class="card scene"><span class="pill">${s.evidenceClass}</span><h2>${s.title}</h2><p>${s.text||''}</p>${s.amount!=null?`<p class="gold"><b>${money(s.amount)}</b></p>`:''}${s.showRuleIds&&s.ruleIds?.length?`<p class="muted">Rules: ${s.ruleIds.join(', ')}</p>`:''}${s.showSourceIds&&s.sourceIds?.length?`<p class="muted">Sources: ${s.sourceIds.join(', ')}</p>`:''}</section>`).join('');} $('run').onclick=render;$('lang').onchange=render;render();</script></body></html>
