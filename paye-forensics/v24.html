<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v24 | Pensioner Allowance Split</title><style>body{margin:0;background:#0B0B0D;color:#F4F1EA;font:16px system-ui;line-height:1.45}.wrap{max-width:1000px;margin:auto;padding:28px}.gold{color:#C6A15B}.card{border:1px solid #343238;border-radius:18px;padding:20px;margin:16px 0;background:#121216}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.pill{display:inline-block;padding:5px 9px;border:1px solid #555;border-radius:999px;font-size:12px}.big{font-size:clamp(32px,6vw,62px);font-weight:750}.muted{color:#b9b4aa}.warn{border-color:#C98A3D}.bar{height:12px;background:#29282d;border-radius:20px;overflow:hidden;margin-top:10px}.fill{height:100%;background:#C6A15B;animation:grow 1s ease both}@keyframes grow{from{width:0}to{width:var(--w)}}button{background:#C6A15B;border:0;border-radius:10px;padding:11px 15px;font-weight:700}input{width:100%;box-sizing:border-box;background:#0B0B0D;color:#fff;border:1px solid #555;border-radius:9px;padding:9px;margin-top:5px}</style></head><body><main class="wrap"><span class="pill">PAYE FORENSICS v24</span><h1>Where did my <span class="gold">Personal Allowance</span> go?</h1><p class="muted">A pensioner-friendly visual for several small pensions, State Pension and untaxed savings interest.</p><section class="grid"><div class="card"><label>State Pension £<input id="sp" type="number" value="0"></label></div><div class="card"><label>Untaxed interest £<input id="ui" type="number" value="3000"></label></div><div class="card"><label>Interest covered at 0% £<input id="zr" type="number" value="1000"></label></div></section><section class="grid"><div class="card"><h3>Pension 1</h3><label>Annual pension £<input id="p1" type="number" value="5000"></label><label>Code<input id="c1" value="500L"></label></div><div class="card"><h3>Pension 2</h3><label>Annual pension £<input id="p2" type="number" value="4000"></label><label>Code<input id="c2" value="400L"></label></div><div class="card"><h3>Pension 3</h3><label>Annual pension £<input id="p3" type="number" value="3000"></label><label>Code<input id="c3" value="BR"></label></div></section><button id="run">Show my allowance story</button><div id="out"></div></main><script type="module">import{buildPensionerAllowanceSplit}from'./pensioner-allowance-split-v24.js';const money=n=>'£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:2});run.onclick=()=>{const r=buildPensionerAllowanceSplit({statePension:+sp.value,untaxedInterest:+ui.value,savingsZeroRateCoverage:+zr.value,pensions:[{label:'Pension 1',annualIncome:+p1.value,taxCode:c1.value},{label:'Pension 2',annualIncome:+p2.value,taxCode:c2.value},{label:'Pension 3',annualIncome:+p3.value,taxCode:c3.value}]});out.innerHTML=`<section class="card"><span class="pill">START</span><div class="big">${money(r.personalAllowance)}</div><b>Your Personal Allowance</b></section>${r.statePension?`<section class="card warn"><span class="pill">INFERRED</span><h2>State Pension</h2><p>${money(r.statePension)} can use part of your tax-free capacity even though tax is not normally taken from the State Pension itself.</p></section>`:''}${r.untaxedInterest?`<section class="card warn"><span class="pill">INFERRED</span><h2>Untaxed interest</h2><p>${money(r.untaxedInterest)} entered. About ${money(r.savingsZeroRateCoverage)} is shown as covered at 0% in this illustration, leaving ${money(r.interestPotentiallyTaxable)} that may affect coding.</p></section>`:''}<section class="grid">${r.allocations.map(a=>`<div class="card"><span class="pill">${a.taxCode||'NO CODE'}</span><h2>${a.label}</h2><p>Income: ${money(a.annualIncome)}</p><p>Illustrated allowance here: <b class="gold">${money(a.illustrativeAllowanceAllocated)}</b></p><p>Illustrated taxable remainder: ${money(a.illustrativeTaxableRemainder)}</p><div class="bar"><div class="fill" style="--w:${Math.min(100,a.annualIncome?100*a.illustrativeAllowanceAllocated/a.annualIncome:0)}%"></div></div></div>`).join('')}</section><section class="card"><h2>One allowance, several places</h2><p>The important idea is that you still have only one Personal Allowance for the year. HMRC may allocate it across pension sources and may also use part of it to deal with taxable income that is not taxed before payment, such as State Pension or untaxed interest.</p><p><b>Illustrated allowance pool left after the inputs above:</b> ${money(r.surplusIllustrativeAllowance)}</p><p class="muted">${r.guardrail}</p></section>${r.findings.map(f=>`<section class="card ${f.evidenceClass==='ILLUSTRATIVE'?'':'warn'}"><span class="pill">${f.evidenceClass}</span><h3>${f.title}</h3><p>${f.detail}</p></section>`).join('')}`};</script></body></html>
