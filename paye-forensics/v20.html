<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v20 | New Job PAYE Guardian</title><style>body{margin:0;background:#0B0B0D;color:#F4F1EA;font:16px system-ui;line-height:1.45}.wrap{max-width:980px;margin:auto;padding:28px}.gold{color:#C6A15B}.card{border:1px solid #343238;border-radius:18px;padding:20px;margin:16px 0;background:#121216}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.pill{display:inline-block;padding:5px 9px;border:1px solid #555;border-radius:999px;font-size:12px}.big{font-size:clamp(32px,6vw,64px);font-weight:750}.muted{color:#b9b4aa}.active{border-color:#C6A15B}.warn{border-color:#C98A3D}button{background:#C6A15B;border:0;border-radius:10px;padding:11px 15px;font-weight:700}input,select{width:100%;box-sizing:border-box;background:#0B0B0D;color:#fff;border:1px solid #555;border-radius:9px;padding:9px;margin-top:5px}</style></head><body><main class="wrap"><span class="pill">PAYE FORENSICS v20</span><h1><span class="gold">New Job PAYE Guardian</span></h1><p class="muted">One journey from starter declaration to first payslip, 35-day watch, allowance collision checks and full PAYE Forensics.</p><section class="grid"><div class="card"><label>First pay received?<select id="paid"><option value="no">No</option><option value="yes">Yes</option></select></label></div><div class="card"><label>Days since start<input id="days" type="number" value="1"></label></div><div class="card"><label>Another job still live?<select id="other"><option value="no">No</option><option value="yes">Yes</option></select></label></div><div class="card"><label>Starter declaration<select id="decl"><option value="">Not sure / none</option><option>A</option><option>B</option><option>C</option></select></label></div><div class="card"><label>P45 provided?<select id="p45"><option value="no">No</option><option value="yes">Yes</option></select></label></div><div class="card"><label>First payslip code<input id="paycode" placeholder="e.g. 1257L"></label></div><div class="card"><label>HMRC current code<input id="hmrccode" placeholder="e.g. BR"></label></div><div class="card"><label>HMRC underpayment £<input id="under" type="number" value="0"></label></div></section><button id="run">Run Guardian journey</button><div id="out"></div></main><script type="module">import{routeNewJobJourney}from'./new-job-paye-guardian.js';run.onclick=()=>{const r=routeNewJobJourney({firstPayReceived:paid.value==='yes',daysSinceStart:+days.value,anotherJobLive:other.value==='yes',starterDeclaration:decl.value,p45Provided:p45.value==='yes',firstPayslipCode:paycode.value,hmrcCurrentCode:hmrccode.value,hmrcUnderpayment:+under.value,activeSources:other.value==='yes'?[{id:'j1'},{id:'j2'}]:[{id:'j1'}]});out.innerHTML=`<section class="card active"><span class="pill">CURRENT STAGE</span><div class="big">${r.headline}</div><p>${r.guardrail}</p></section><section class="grid">${r.stages.map(s=>`<div class="card ${s.status==='ACTIVE'||s.status==='REVIEW_NOW'?'active':''}"><span class="pill">${s.status}</span><h2>${s.title}</h2><b>${s.module}</b><p>${s.purpose}</p>${s.day?`<p>Day ${s.day}</p>`:''}</div>`).join('')}</section>${r.signals.length?'<section class="card warn"><h2>Things to check now</h2>'+r.signals.map(x=>`<p><b>${x.title}</b> <span class="pill">${x.evidenceClass}</span></p>`).join('')+'</section>':''}`};</script></body></html>
