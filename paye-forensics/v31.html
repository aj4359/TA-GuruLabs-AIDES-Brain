<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v31</title><style>body{margin:0;background:#0b0b0d;color:#f5f1e8;font:16px system-ui}.wrap{max-width:1080px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pill,button{border:1px solid #4b473f;border-radius:999px;padding:8px 12px;background:#151419;color:#f5f1e8}button.active,.goldbtn{background:#c6a15b;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card,.tax-scene{border:1px solid #343138;border-radius:18px;padding:18px;background:#121216;margin:14px 0}.muted{opacity:.7}.gold{color:#c6a15b}input,select{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #454148;background:#0d0d10;color:#fff;margin-top:5px}.source{border-left:4px solid #c6a15b}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chunk{padding:10px 12px;border-radius:12px;background:#c6a15b;color:#111;font-weight:700}.arrow{font-size:24px}.warn{border-color:#b77443}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="wrap"><div class="top"><div><span class="pill">PAYE FORENSICS v31</span><h1>Map your PAYE sources. <span class="gold">See where the allowance is working.</span></h1></div><div id="levels"><button data-level="SIMPLE" class="active">Simple</button><button data-level="NORMAL">Normal</button><button data-level="ADVISER">Adviser</button></div></div><p class="muted">Only confirmed source facts are used in the calculation.</p><section class="card"><h2>Your PAYE sources</h2><div id="sources"></div><button id="add" class="goldbtn">Add job or pension</button></section><section class="card"><h2>Other taxable income</h2><div class="grid"><label>State Pension £<input id="statePension" type="number" value="0"></label><label>Untaxed savings interest £<input id="savings" type="number" value="0"></label><label>Taxable benefits £<input id="benefits" type="number" value="0"></label><label>Dividends £<input id="dividends" type="number" value="0"></label><label>HMRC says underpayment £<input id="hmrcUnder" type="number" value="0"></label><label>IYA £<input id="iya" type="number" value="0"></label></div><button id="run" class="goldbtn">Build my tax story</button></section><section id="gate" class="card"></section><section id="allowance" class="card"></section><section id="summary" class="card"></section><section id="story"></section></main><script src="../prototypes/paye-forensics/rules-2026-27.js"></script><script src="../prototypes/paye-forensics/engine-v2.js"></script><script type="module">import{buildConfirmedSourceSet}from'./multi-source-capture-v31.js';import{buildUnifiedTaxVisualCase}from'./unified-visual-adapter-v28.js';import{renderStoryHtml}from'./visual-renderer-v29.js';let level='SIMPLE';let rows=[{type:'employment',label:'Job 1',income:26000,code:'1257L',tax:2600,confirmed:true},{type:'employment',label:'Job 2',income:9000,code:'BR',tax:1200,confirmed:true}];const money=n=>'£'+Number(n||0).toLocaleString('en-GB',{maximumFractionDigits:2});function paintSources(){sources.innerHTML=rows.map((r,i)=>`<div class="card source" data-i="${i}"><div class="grid"><label>Label<input data-k="label" value="${r.label}"></label><label>Type<select data-k="type"><option value="employment" ${r.type==='employment'?'selected':''}>Job</option><option value="private-pension" ${r.type==='private-pension'?'selected':''}>Private pension</option></select></label><label>Annual income £<input data-k="income" type="number" value="${r.income}"></label><label>Tax code<input data-k="code" value="${r.code}"></label><label>Tax deducted £<input data-k="tax" type="number" value="${r.tax}"></label><label>Confirmed?<select data-k="confirmed"><option value="yes" ${r.confirmed?'selected':''}>Yes</option><option value="no" ${!r.confirmed?'selected':''}>No</option></select></label></div></div>`).join('');document.querySelectorAll('[data-i]').forEach(card=>card.querySelectorAll('input,select').forEach(el=>el.onchange=()=>{const i=+card.dataset.i,k=el.dataset.k;rows[i][k]=k==='income'||k==='tax'?+el.value:k==='confirmed'?el.value==='yes':el.value;}));}add.onclick=()=>{rows.push({type:'private-pension',label:`Source ${rows.length+1}`,income:0,code:'',tax:0,confirmed:false});paintSources();};document.querySelectorAll('#levels button').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('#levels button').forEach(x=>x.classList.toggle('active',x===b));runCase();});function runCase(){const set=buildConfirmedSourceSet({sources:rows.map((r,i)=>({id:`s${i+1}`,label:r.label,type:r.type,annualIncome:r.income,taxCode:r.code,taxDeducted:r.tax,confirmed:r.confirmed,active:true}))});gate.innerHTML=set.gatePassed?'<h2>Evidence gate passed</h2><p>All active PAYE source facts are confirmed.</p>':`<h2>Evidence gate not complete</h2><p>${set.warnings.join(' ')}</p>`;if(!set.confirmed.length){summary.innerHTML='<h2>Add and confirm at least one PAYE source.</h2>';allowance.innerHTML='';story.innerHTML='';return;}const input={employmentIncome:set.totals.employmentIncome,secondJobIncome:0,privatePension:set.totals.privatePension,statePension:+statePension.value,benefitsInKind:+benefits.value,otherNonSavings:set.totals.otherNonSavings,savingsInterest:+savings.value,dividends:+dividends.value,taxAlreadyDeducted:set.totals.taxAlreadyDeducted,hmrcStatedUnderpayment:+hmrcUnder.value};const caseOut=buildUnifiedTaxVisualCase(input,{languageLevel:level,activeSources:set.activeSources,includePensionerSplit:set.confirmed.some(s=>s.type==='private-pension'),pensions:set.confirmed.filter(s=>s.type==='private-pension').map(s=>({label:s.label,annualIncome:s.annualIncome,taxCode:s.taxCode,observed:true})),taxCode:set.confirmed[0]?.taxCode,iyaAmount:+iya.value});const calc=caseOut.deterministicResult;const pa=calc.personalAllowance;let remaining=pa;const chunks=set.confirmed.map(s=>{const used=Math.min(s.annualIncome,remaining);remaining=Math.max(0,remaining-used);return `<div><div class="chunk">${s.label}: ${money(used)}</div><small class="muted">Code ${s.taxCode||'not supplied'}</small></div>`;}).join('<span class="arrow">→</span>');allowance.innerHTML=`<h2>Allowance flow</h2><p>One Personal Allowance: <b class="gold">${money(pa)}</b></p><div class="flow"><div class="chunk">Start ${money(pa)}</div><span class="arrow">→</span>${chunks}</div><p class="muted">Illustrative flow only. HMRC may allocate allowances and deductions differently between PAYE sources.</p>`;summary.innerHTML=`<h2>Reconciliation</h2><div class="grid"><p>Income<br><b>${money(calc.nonSavingsGross+calc.savingsGross+calc.dividendsGross)}</b></p><p>Personal Allowance<br><b>${money(calc.personalAllowance)}</b></p><p>Tax due<br><b>${money(calc.taxDue)}</b></p><p>Tax deducted<br><b>${money(calc.taxAlreadyDeducted)}</b></p><p>Possible underpayment<br><b>${money(calc.reconstructedUnderpayment)}</b></p><p>HMRC difference<br><b>${money(calc.difference)}</b></p></div><p><b>${calc.confidence}</b></p>`;story.innerHTML=renderStoryHtml(caseOut.visualStory);}run.onclick=runCase;paintSources();runCase();</script></body></html>
