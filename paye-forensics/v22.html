<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v22 | Automatic Payslip Movie</title><style>body{margin:0;background:#0B0B0D;color:#F4F1EA;font:16px system-ui;line-height:1.45}.wrap{max-width:1040px;margin:auto;padding:28px}.gold{color:#C6A15B}.card{border:1px solid #343238;border-radius:18px;padding:20px;margin:16px 0;background:#121216}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.pill{display:inline-block;padding:5px 9px;border:1px solid #555;border-radius:999px;font-size:12px}.big{font-size:clamp(34px,7vw,70px);font-weight:760}.muted{color:#b9b4aa}.warn{border-color:#C98A3D}.ok{border-color:#5B8C6A}.frame{animation:fade .45s ease both}@keyframes fade{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}button{background:#C6A15B;border:0;border-radius:10px;padding:11px 15px;font-weight:700}input,select{width:100%;box-sizing:border-box;background:#0B0B0D;color:#fff;border:1px solid #555;border-radius:9px;padding:9px;margin-top:5px}</style></head><body><main class="wrap"><span class="pill">PAYE FORENSICS v22</span><h1>Automatic <span class="gold">Payslip Movie</span></h1><p class="muted">Enter only what the payslip actually shows. The engine reconstructs a possible code-based tax expectation automatically.</p><section class="grid"><div class="card"><label>Pay frequency<select id="freq"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="fortnightly">Fortnightly</option><option value="four-weekly">Four-weekly</option></select></label></div><div class="card"><label>HMRC-stated underpayment £<input id="hmrc" type="number" value="560"></label></div></section><section class="grid" id="inputs"></section><button id="run">Play reconstruction</button><div id="out"></div></main><script type="module">import{buildGuardianCaseBundleV22}from'./guardian-case-bundle-v22.js';const data=[{gross:2500,tax:110,code:'1257L'},{gross:2500,tax:110,code:'1257L'},{gross:2500,tax:110,code:'1257L'},{gross:2500,tax:110,code:'1257L'}];const inputs=document.querySelector('#inputs');inputs.innerHTML=data.map((p,i)=>`<div class="card"><h3>Period ${i+1}</h3><label>Gross pay £<input id="g${i}" type="number" value="${p.gross}"></label><label>Tax deducted £<input id="t${i}" type="number" value="${p.tax}"></label><label>Tax code<input id="c${i}" value="${p.code}"></label></div>`).join('');const money=n=>'£'+Number(n||0).toFixed(2);document.querySelector('#run').onclick=()=>{const payslips=data.map((_,i)=>({period:i+1,taxPeriod:i+1,gross:+document.querySelector('#g'+i).value,taxDeducted:+document.querySelector('#t'+i).value,taxCode:document.querySelector('#c'+i).value}));const r=buildGuardianCaseBundleV22({firstPayReceived:true,firstPayslipCode:payslips[0].taxCode,hmrcUnderpayment:+hmrc.value,payFrequency:freq.value,payslips,activeSources:[{id:'job1',label:'Current job',income:30000,taxCode:payslips[0].taxCode}]});out.innerHTML=`<section class="card"><span class="pill">AUTOMATIC RECONSTRUCTION</span><div class="big">${money(r.payslipMovie.possibleShortfall)}</div><p>Possible year-to-date shortfall from the confirmed payslip sequence.</p></section><section class="grid">${r.payslipMovie.frames.map(f=>`<div class="card frame ${f.possibleShortfall>0?'warn':''}"><span class="pill">PERIOD ${f.period}</span><h2>${f.taxCode||'No code'}</h2><p>Gross ${money(f.gross)}</p><p>Tax actually deducted <b>${money(f.actualTax)}</b></p><p>Reconstructed expectation <b class="gold">${money(f.reconstructedExpectedTax)}</b></p><p>Possible running shortfall <b>${money(f.possibleShortfall)}</b></p><p class="muted">${f.method}</p>${f.warning?`<p>${f.warning}</p>`:''}</div>`).join('')}</section><section class="card ${r.reconciliation.state==='UNRESOLVED_DIFFERENCE'?'warn':'ok'}"><h2>Reconciliation Bridge</h2><p>HMRC says <b>${money(r.reconciliation.hmrcUnderpayment)}</b></p><p>Reconstruction says <b>${money(r.reconciliation.reconstructedPossibleShortfall)}</b></p><p>Difference <b>${money(r.reconciliation.difference)}</b></p><span class="pill">${r.reconciliation.state}</span></section>${r.missingPiecePrompts.length?`<section class="card warn"><h2>Missing Piece Mode</h2>${r.missingPiecePrompts.map(x=>`<p>• ${x}</p>`).join('')}</section>`:''}<section class="card"><p class="muted">${r.payslipMovie.disclaimer}</p><p class="muted">${r.guardrail}</p></section>`};</script></body></html>
