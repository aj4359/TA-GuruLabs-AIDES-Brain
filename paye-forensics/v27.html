<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v27 | Tax Visual Engine</title><style>body{margin:0;background:#0b0b0d;color:#f5f2eb;font:16px system-ui}.wrap{max-width:980px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.seg{display:flex;border:1px solid #45434b;border-radius:12px;overflow:hidden}.seg button{border:0;background:#17171c;color:#ddd;padding:10px 14px}.seg button.active{background:#c8a45f;color:#111}.card{background:#121217;border:1px solid #33323a;border-radius:18px;padding:20px;margin:14px 0}.scene{opacity:0;transform:translateY(8px);animation:in .45s ease forwards}@keyframes in{to{opacity:1;transform:none}}.amount{font-size:34px;font-weight:800;color:#c8a45f}.pill{display:inline-block;border:1px solid #55525d;border-radius:999px;padding:4px 8px;font-size:12px;color:#c9c3b8}.muted{color:#aaa49a}.why{margin-top:10px;background:none;border:1px solid #57535d;color:#eee;border-radius:9px;padding:8px 10px}.details{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #48464e}.details.open{display:block}</style></head><body><main class="wrap"><div class="top"><div><span class="pill">TA GURULABS • TAX VISUAL ENGINE v27</span><h1>One tax case. Three ways to understand it.</h1></div><div class="seg"><button data-level="SIMPLE">Simple</button><button class="active" data-level="NORMAL">Normal</button><button data-level="ADVISER">Adviser</button></div></div><p class="muted">Same facts, same maths, same evidence. Only the explanation changes.</p><div id="story"></div></main><script type="module">import{compileTaxVisualStory}from'./tax-visual-engine-v27.js';const sample={incomeTotal:28750,personalAllowance:12570,taxDue:3236,taxDeducted:2596,underpayment:640,kCode:'K154 M1',iyaAmount:640,allowanceCollision:false,paSourceIds:['GOVUK-PA'],taxSourceIds:['GOVUK-RATES'],kCodeSourceIds:['GOVUK-KCODE'],iyaSourceIds:['HMRC-IYA']};const story=document.querySelector('#story');function render(level){const r=compileTaxVisualStory(sample,{languageLevel:level});story.innerHTML=r.scenes.map((s,i)=>`<section class="card scene" style="animation-delay:${i*70}ms"><span class="pill">${s.evidenceClass}</span><h2>${s.title||''}</h2>${s.amount!=null?`<div class="amount">£${Number(s.amount).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>`:''}<p>${s.text||''}</p><button class="why">Why?</button><div class="details"><b>Evidence:</b> ${s.evidenceClass}<br><b>Rule IDs:</b> ${(s.ruleIds||[]).join(', ')||'—'}<br><b>Source IDs:</b> ${(s.sourceIds||[]).join(', ')||'—'}</div></section>`).join('')+`<section class="card"><h2>Protection boundary</h2><p>${r.guardrails.join(' ')}</p></section>`;document.querySelectorAll('.why').forEach(b=>b.onclick=()=>b.nextElementSibling.classList.toggle('open'));}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-level]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.level)});render('NORMAL');</script></body></html>
