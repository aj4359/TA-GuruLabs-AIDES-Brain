ry(x=>x.showRuleIds===false));ok('Adviser mode exposes rule IDs flag',a.visualStory.scenes.every(x=>x.showRuleIds===true));out.textContent=log.join('\n')+'\n\n'+(log.every(x=>x.startsWith('PASS'))?'ALL PASS':'CHECK FAILURES');</script>
