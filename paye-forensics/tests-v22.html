<!doctype html><meta charset="utf-8"><title>PAYE Forensics v22 tests</title><pre id="out"></pre><script type="module">import{reconstructPayPeriods,parseCode}from'./pay-period-tax-engine-v22.js';const tests=[];const t=(name,fn)=>{try{fn();tests.push(['PASS',name])}catch(e){tests.push(['FAIL',name,e.message])}};const eq=(a,b,m='')=>{if(a!==b)throw new Error(`${m} expected ${b}, got ${a}`)};t('1257L parses to £12,570 coded allowance',()=>eq(parseCode('1257L').allowance,12570));t('M1 marker is non-cumulative',()=>eq(parseCode('1257L M1').nonCumulative,true));t('BR monthly tax is 20% of gross',()=>{const r=reconstructPayPeriods({payslips:[{gross:2000,taxDeducted:300,taxCode:'BR'}]});eq(r.frames[0].reconstructedExpectedTax,400)});t('NT reconstructs zero tax',()=>{const r=reconstructPayPeriods({payslips:[{gross:2000,taxDeducted:50,taxCode:'NT'}]});eq(r.frames[0].reconstructedExpectedTax,0)});t('Numeric cumulative code uses YTD pay',()=>{const r=reconstructPayPeriods({payslips:[{gross:2500,taxDeducted:0,taxCode:'1257L',taxPeriod:1},{gross:2500,taxDeducted:0,taxCode:'1257L',taxPeriod:2}]});if(r.frames[1].reconstructedTaxYTD<r.frames[0].reconstructedTaxYTD)throw new Error('YTD expected tax went backwards')});t('K code is not silently reconstructed',()=>{const r=reconstructPayPeriods({payslips:[{gross:2000,taxDeducted:500,taxCode:'K500'}]});eq(r.frames[0].evidenceClass,'OBSERVED_ONLY')});t('Scottish numeric code uses Scotland jurisdiction',()=>eq(parseCode('S1257L').jurisdiction,'Scotland'));t('Actual > reconstructed produces possible overdeduction, not shortfall',()=>{const r=reconstructPayPeriods({payslips:[{gross:1000,taxDeducted:500,taxCode:'1257L'}]});eq(r.possibleShortfall,0);if(r.possibleOverdeduction<=0)throw new Error('Expected overdeduction signal')});out.textContent=tests.map(x=>x.join(' | ')).join('\n');if(tests.some(x=>x[0]==='FAIL'))document.body.style.background='#511';</script>
