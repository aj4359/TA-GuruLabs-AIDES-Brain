<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v19 | Starter Declaration Coach</title><style>body{margin:0;background:#0B0B0D;color:#F4F1EA;font:16px system-ui;line-height:1.5}.wrap{max-width:900px;margin:auto;padding:28px}.card{background:#121216;border:1px solid #343238;border-radius:18px;padding:20px;margin:16px 0}.gold{color:#C6A15B}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}label{display:block}.q{padding:14px;border:1px solid #3d3b42;border-radius:14px;margin:12px 0}.pill{display:inline-block;padding:5px 9px;border:1px solid #555;border-radius:999px;font-size:12px}.warn{border-color:#C98A3D}.high{border-color:#a95f37}.muted{color:#b9b4aa}button{background:#C6A15B;border:0;border-radius:10px;padding:11px 16px;font-weight:750}.result{font-size:clamp(28px,6vw,54px);font-weight:800}</style></head><body><main class="wrap"><span class="pill">PAYE FORENSICS v19</span><h1>Starter Declaration <span class="gold">Coach</span></h1><p class="muted">Understand the risk before your first payroll run. This does not replace HMRC's official starter checklist.</p><section class="card"><div class="q"><label><input type="checkbox" id="p45"> I have given my new employer a P45</label></div><div class="q"><label><input type="checkbox" id="another"> I still have another job</label></div><div class="q"><label><input type="checkbox" id="ended"> My previous job ended</label></div><div class="q"><label><input type="checkbox" id="other"> I have received taxable benefits or pension income this tax year</label></div><div class="q"><label><input type="checkbox" id="paid"> I have already received my first pay from this employer</label></div><button id="run">Check my starter situation</button></section><div id="out"></div></main><script type="module">import{coachStarterDeclaration}from'./starter-declaration-coach.js';run.onclick=()=>{const r=coachStarterDeclaration({hasP45:p45.checked,anotherJobLive:another.checked,previousJobEnded:ended.checked,receivedBenefitsOrPensionThisTaxYear:other.checked,hasBeenPaidByNewEmployer:paid.checked});out.innerHTML=`<section class="card"><span class="pill">PLAIN-ENGLISH CHECK</span><h2>What your answers suggest</h2>${r.suggestedStatement?`<div class="result gold">Statement ${r.suggestedStatement}</div><p>This is a coaching signal based on the facts you entered. Confirm the exact official wording before submitting anything.</p>`:'<p>No single declaration route can be suggested safely from the current answers.</p>'}</section>`+r.findings.map(f=>`<section class="card ${f.level==='HIGH'?'high':'warn'}"><span class="pill">${f.level}</span><h2>${f.title}</h2><p>${f.explanation}</p><p><b>Next step:</b> ${f.action}</p></section>`).join('')+`<section class="card"><h2>Final confirmation</h2><p>Before the information goes to payroll, confirm these facts are true: P45 supplied: <b>${r.summary.hasP45?'Yes':'No'}</b>; another job still live: <b>${r.summary.anotherJobLive?'Yes':'No'}</b>; previous job ended: <b>${r.summary.previousJobEnded?'Yes':'No'}</b>; taxable benefits/pension this tax year: <b>${r.summary.receivedBenefitsOrPensionThisTaxYear?'Yes':'No'}</b>.</p><p class="muted">${r.guardrail}</p></section>`};</script></body></html>
