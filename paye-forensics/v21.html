<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v21 | Guardian Case + Payslip Movie</title><style>body{margin:0;background:#0B0B0D;color:#F4F1EA;font:16px system-ui;line-height:1.45}.wrap{max-width:1100px;margin:auto;padding:28px}.gold{color:#C6A15B}.card{border:1px solid #343238;border-radius:18px;padding:20px;margin:16px 0;background:#121216}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.pill{display:inline-block;padding:5px 9px;border:1px solid #555;border-radius:999px;font-size:12px}.big{font-size:clamp(30px,6vw,58px);font-weight:750}.muted{color:#b9b4aa}.warn{border-color:#C98A3D}.ok{border-color:#5B8C6A}.frame{position:relative;padding-left:24px}.frame:before{content:'';position:absolute;left:7px;top:8px;bottom:-20px;width:2px;background:#4a474f}.frame:last-child:before{display:none}.dot{position:absolute;left:0;top:8px;width:16px;height:16px;border-radius:50%;background:#C6A15B}.bar{height:10px;background:#29282d;border-radius:999px;overflow:hidden}.fill{height:100%;background:#C6A15B;animation:grow 1s ease both}@keyframes grow{from{width:0}to{width:var(--w)}}button{background:#C6A15B;border:0;border-radius:10px;padding:11px 15px;font-weight:700}input,select{width:100%;box-sizing:border-box;background:#0B0B0D;color:#fff;border:1px solid #555;border-radius:9px;padding:9px;margin-top:5px}</style></head><body><main class="wrap"><span class="pill">PAYE FORENSICS v21</span><h1>New Job PAYE Guardian <span class="gold">+ Payslip Movie</span></h1><p class="muted">See how starter choices, payroll codes and successive deductions may connect to a later underpayment.</p><section class="grid"><div class="card"><label>Another job still live?<select id="other"><option value="no">No</option><option value="yes" selected>Yes</option></select></label><label>P45 supplied?<select id="p45"><option value="no" selected>No</option><option value="yes">Yes</option></select></label><label>Starter declaration<select id="decl"><option>A</option><option>B</option><option selected>C</option><option value="">None / not sure</option></select></label></div><div class="card"><label>Previous tax code<input id="prev" value="1257L"></label><label>First payslip code<input id="first" value="1257L"></label><label>HMRC current code<input id="hmrc" value="BR"></label></div><div class="card"><label>HMRC underpayment £<input id="under" type="number" value="640"></label><label>Days since start<input id="days" type="number" value="42"></label><label>First pay received?<select id="paid"><option value="yes" selected>Yes</option><option value="no">No</option></select></label></div></section><section class="card"><h2>Payslip story</h2><div class="grid"><label>Month 1 tax deducted £<input id="t1" type="number" value="110"></label><label>Month 1 reconstructed tax £<input id="e1" type="number" value="250"></label><label>Month 2 tax deducted £<input id="t2" type="number" value="115"></label><label>Month 2 reconstructed tax £<input id="e2" type="number" value="255"></label><label>Month 3 tax deducted £<input id="t3" type="number" value="120"></label><label>Month 3 reconstructed tax £<input id="e3" type="number" value="260"></label><label>Month 4 tax deducted £<input id="t4" type="number" value="130"></label><label>Month 4 reconstructed tax £<input id="e4" type="number" value="270"></label></div></section><button id="run">Play my PAYE story</button><div id="out"></div></main><script type="module">import{buildGuardianCaseBundle}from'./guardian-case-bundle-v21.js';const q=id=>document.getElementById(id),money=n=>'£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});q('run').onclick=()=>{const sources=q('other').value==='yes'?[{id:'job1',label:'Existing job',income:26000,taxCode:'1257L'},{id:'job2',label:'New job',income:12000,taxCode:q('first').value}]:[{id:'job1',label:'New job',income:12000,taxCode:q('first').value}];const r=buildGuardianCaseBundle({firstPayReceived:q('paid').value==='yes',daysSinceStart:+q('days').value,anotherJobLive:q('other').value==='yes',p45Provided:q('p45').value==='yes',starterDeclaration:q('decl').value,previousTaxCode:q('prev').value,firstPayslipCode:q('first').value,hmrcCurrentCode:q('hmrc').value,hmrcUnderpayment:+q('under').value,activeSources:sources,payslips:[1,2,3,4].map(i=>({period:'Month '+i,gross:2500,taxDeducted:+q('t'+i).value,reconstructedExpectedTax:+q('e'+i).value,taxCode:q('first').value}))});const max=Math.max(1,...r.payslipMovie.frames.map(f=>f.cumulativeIllustrativeShortfall));out.innerHTML=`<section class="card warn"><span class="pill">${r.routeComparison.expectedFamily}</span><h2>What probably should have happened?</h2><p>${r.routeComparison.expectedText}</p><p><b>First payslip:</b> ${r.routeComparison.actualCode||'not captured'} &nbsp; <b>HMRC:</b> ${r.routeComparison.hmrcCode||'not captured'}</p></section><section class="card ${r.allowanceCollision.findings.length?'warn':'ok'}"><h2>Personal Allowance map</h2>${r.allowanceCollision.sources.map(s=>`<p><b>${s.label}</b> ${s.taxCode} → apparent coded allowance ${money(s.codedAllowance)}</p>`).join('')}${r.allowanceCollision.findings.map(f=>`<p><b>${f.title}</b>: ${f.explanation}</p>`).join('')}</section><section class="card"><h2>Payslip Movie</h2>${r.payslipMovie.frames.map(f=>`<div class="frame"><span class="dot"></span><h3>${f.period} · ${f.taxCode}</h3><p>Tax deducted ${money(f.taxDeducted)} · reconstructed ${money(f.reconstructedExpectedTax)} · possible period gap ${money(f.periodDifference)}</p><div class="bar"><div class="fill" style="--w:${Math.max(3,(f.cumulativeIllustrativeShortfall/max)*100)}%"></div></div><p class="gold"><b>Possible cumulative shortfall ${money(f.cumulativeIllustrativeShortfall)}</b></p></div>`).join('')}<hr><p><b>HMRC says:</b> ${money(r.payslipMovie.statedUnderpayment)} &nbsp; <b>Illustrative payslip story:</b> ${money(r.payslipMovie.illustrativeCumulativeShortfall)} &nbsp; <b>Difference:</b> ${money(r.payslipMovie.reconciliationDifference)}</p><p class="muted">${r.payslipMovie.disclaimer}</p></section><section class="card"><h2>Evidence trail</h2>${r.chronology.map(c=>`<p><span class="pill">${c.evidenceClass}</span> ${c.label}</p>`).join('')}<p class="muted">${r.guardrail}</p></section>`;};</script></body></html>
