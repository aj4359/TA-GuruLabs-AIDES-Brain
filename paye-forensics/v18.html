<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v18 | Allowance Collision</title><style>body{margin:0;background:#0B0B0D;color:#F4F1EA;font:16px system-ui;line-height:1.45}.wrap{max-width:980px;margin:auto;padding:28px}.gold{color:#C6A15B}.card{border:1px solid #343238;border-radius:18px;padding:20px;margin:16px 0;background:#121216}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.source{position:relative;overflow:hidden}.bar{height:12px;background:#2a292e;border-radius:20px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#C6A15B;transform-origin:left;animation:grow 1.2s ease both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.warn{border-color:#C98A3D}.pill{display:inline-block;padding:5px 9px;border:1px solid #555;border-radius:999px;font-size:12px}.big{font-size:clamp(34px,7vw,70px);font-weight:750}.arrow{text-align:center;font-size:28px;color:#C6A15B}.muted{color:#b9b4aa}button{background:#C6A15B;border:0;border-radius:10px;padding:11px 15px;font-weight:700}input{width:100%;box-sizing:border-box;background:#0B0B0D;color:#fff;border:1px solid #555;border-radius:9px;padding:9px;margin-top:5px}</style></head><body><main class="wrap"><span class="pill">PAYE FORENSICS v18</span><h1>See where your <span class="gold">Personal Allowance</span> appears to be working.</h1><p class="muted">A visual diagnostic for multiple jobs and pensions. It does not decide that a code is wrong or issue a replacement code.</p><section class="card"><div class="big">£12,570</div><strong>Standard Personal Allowance</strong><div class="bar"><div class="fill"></div></div></section><section class="grid"><div class="card source"><h2>Job 1</h2><label>Income £<input id="i1" type="number" value="26000"></label><label>Tax code<input id="c1" value="1257L"></label></div><div class="card source"><h2>Job 2</h2><label>Income £<input id="i2" type="number" value="12000"></label><label>Tax code<input id="c2" value="1257L"></label></div></section><button id="run">Animate allowance check</button><div id="out"></div></main><script type="module">import{buildAllowanceCollisionCase}from'./allowance-collision-engine.js';const money=n=>'£'+Number(n||0).toLocaleString('en-GB');document.querySelector('#run').onclick=()=>{const r=buildAllowanceCollisionCase({sources:[{id:'j1',label:'Job 1',income:+i1.value,taxCode:c1.value},{id:'j2',label:'Job 2',income:+i2.value,taxCode:c2.value}]});out.innerHTML='<div class="arrow">↓</div><section class="grid">'+r.sources.map(s=>`<div class="card ${s.fullAllowanceSignal?'warn':''}"><span class="pill">OBSERVED CODE</span><h2>${s.label}: ${s.taxCode}</h2><p>Income ${money(s.income)}</p><p>Code suggests about <b class="gold">${money(s.codedAllowance)}</b> of coded allowance before other code adjustments.</p></div>`).join('')+'</section>'+(r.findings.length?'<div class="arrow">⚠</div>'+r.findings.map(f=>`<section class="card warn"><span class="pill">${f.evidenceClass}</span><h2>${f.title}</h2><p>${f.explanation}</p><p><b>What to check:</b> ${f.nextAction}</p></section>`).join(''):'<section class="card"><h2>No duplicate full-allowance signal found</h2><p>This does not prove every code is correct. Check the code breakdown if anything else looks wrong.</p></section>')+'<section class="card"><h2>Why this matters</h2><p>If the same annual allowance is effectively used at more than one active PAYE source, too little tax can be collected during the year and an underpayment may emerge later. PAYE Forensics shows this as a <b>possible explanation</b>, not a finding of fault.</p><p class="muted">'+r.guardrail+'</p></section>';};</script></body></html>
