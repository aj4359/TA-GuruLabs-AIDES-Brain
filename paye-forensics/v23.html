<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v23 | Cash Flow Story</title><style>body{margin:0;background:#0B0B0D;color:#F4F1EA;font:16px system-ui;line-height:1.45}.wrap{max-width:980px;margin:auto;padding:28px}.gold{color:#C6A15B}.card{border:1px solid #343238;border-radius:18px;padding:20px;margin:16px 0;background:#121216}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.pill{display:inline-block;padding:5px 9px;border:1px solid #555;border-radius:999px;font-size:12px}.big{font-size:clamp(34px,6vw,64px);font-weight:750}.warn{border-color:#C98A3D}.muted{color:#b9b4aa}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0}@media(max-width:700px){.row{grid-template-columns:1fr 1fr}}input{width:100%;box-sizing:border-box;background:#0B0B0D;color:#fff;border:1px solid #555;border-radius:9px;padding:9px}button{background:#C6A15B;border:0;border-radius:10px;padding:11px 15px;font-weight:700}</style></head><body><main class="wrap"><span class="pill">PAYE FORENSICS v23</span><h1>See how your <span class="gold">tax deductions changed over time</span>.</h1><p class="muted">This view separates what payroll actually deducted from what our reconstruction suggests may have been collected under the observed code pattern.</p><section class="card"><div class="row"><b>Period</b><b>Tax code</b><b>Tax deducted £</b><b>Reconstructed £</b></div><div id="rows"></div><button id="add">Add pay period</button></section><section class="card"><label>HMRC stated underpayment £<input id="hmrc" type="number" value="640"></label></section><button id="run">Play cash-flow story</button><div id="out"></div></main><script type="module">import{buildCashFlowStory}from'./cash-flow-story-v23.js';let idx=0;const rows=document.querySelector('#rows');function addRow(p=idx+1,c='1257L',a=110,r=250){idx++;const d=document.createElement('div');d.className='row';d.innerHTML=`<input value="${p}"><input value="${c}"><input type="number" value="${a}"><input type="number" value="${r}">`;rows.appendChild(d)};add.onclick=()=>addRow();addRow(1,'1257L',110,250);addRow(2,'1257L',110,250);addRow(3,'BR',250,250);addRow(4,'BR',250,250);run.onclick=()=>{const frames=[...rows.children].map(r=>({period:r.children[0].value,taxCode:r.children[1].value,taxDeducted:+r.children[2].value,reconstructedTax:+r.children[3].value}));const s=buildCashFlowStory({frames,hmrcUnderpayment:+hmrc.value});out.innerHTML='<section class="card"><span class="pill">CASH FLOW SUMMARY</span><div class="big">£'+s.summary.reconstructedTimingGap.toFixed(2)+'</div><p>Possible cumulative deduction timing gap</p><p>HMRC stated underpayment: £'+s.summary.hmrcStatedUnderpayment.toFixed(2)+' | Difference: £'+s.summary.reconciliationDifference.toFixed(2)+'</p></section>'+s.scenes.map(x=>x.kind==='CODE_CHANGE'?`<section class="card warn"><span class="pill">OBSERVED</span><h2>${x.title}</h2><p>${x.explanation}</p></section>`:`<section class="card"><span class="pill">${x.evidenceClass}</span><h2>Period ${x.period}: ${x.title}</h2><p>Code ${x.taxCode||'—'} | Actual tax £${x.actualTax.toFixed(2)} | Reconstructed £${x.reconstructedTax.toFixed(2)}</p><p>Cumulative actual £${x.cumulativeActual.toFixed(2)} | reconstructed £${x.cumulativeReconstructed.toFixed(2)} | timing gap £${x.cumulativeTimingGap.toFixed(2)}</p></section>`).join('')+'<section class="card warn"><h2>Important</h2>'+s.warnings.map(w=>'<p>'+w+'</p>').join('')+'</section>';};</script></body></html>
