<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v25 | K Code, IYA & Underpayment</title><style>body{margin:0;background:#0b0b0d;color:#f4f1ea;font:16px system-ui;line-height:1.5}.wrap{max-width:980px;margin:auto;padding:28px}.card{background:#121216;border:1px solid #343238;border-radius:18px;padding:20px;margin:16px 0}.gold{color:#c6a15b}.pill{display:inline-block;border:1px solid #555;border-radius:999px;padding:5px 9px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.muted{color:#b9b4aa}.big{font-size:clamp(30px,6vw,64px);font-weight:750}.warn{border-color:#c98a3d}input{width:100%;box-sizing:border-box;padding:9px;border-radius:9px;border:1px solid #555;background:#0b0b0d;color:#fff;margin-top:5px}button{background:#c6a15b;border:0;border-radius:10px;padding:11px 15px;font-weight:700}.flow{font-size:28px;text-align:center;color:#c6a15b}</style></head><body><main class="wrap"><span class="pill">PAYE FORENSICS v25</span><h1><span class="gold">K Codes, IYAs & Underpayments</span><br>made understandable.</h1><p class="muted">See the difference between the tax code, the in-year collection adjustment and the underpayment itself.</p><section class="grid"><div class="card"><label>Previous code<input id="prev" value="1257L"></label></div><div class="card"><label>Current code<input id="code" value="K154M1"></label></div><div class="card"><label>IYA amount £<input id="iya" type="number" value="640"></label></div><div class="card"><label>Previous-year underpayment £<input id="upy" type="number" value="0"></label></div><div class="card"><label>State Pension £<input id="sp" type="number" value="0"></label></div><div class="card"><label>Taxable benefits £<input id="benefits" type="number" value="0"></label></div><div class="card"><label>Taxable interest estimate £<input id="interest" type="number" value="0"></label></div><div class="card"><label>Remaining pay periods<input id="periods" type="number" value="8"></label></div></section><button id="run">Explain my code story</button><div id="out"></div></main><script type="module">import{buildKCodeIYAStory}from'./kcode-iya-underpayment-v25.js';const esc=s=>String(s??'');run.onclick=()=>{const r=buildKCodeIYAStory({previousCode:prev.value,taxCode:code.value,iyaAmount:+iya.value,previousYearUnderpayment:+upy.value,statePension:+sp.value,taxableBenefits:+benefits.value,taxableInterestEstimate:+interest.value,remainingPayPeriods:+periods.value});out.innerHTML=`<section class="card"><span class="pill">PLAIN ENGLISH</span><div class="big">${esc(r.customerSummary)}</div></section>${r.scenes.map((s,i)=>`${i?'<div class="flow">↓</div>':''}<section class="card ${s.id==='KCODE'||s.id==='IYA'?'warn':''}"><span class="pill">${s.evidenceClass}</span><h2>${esc(s.title)}</h2><p>${esc(s.detail||'')}</p>${s.items?'<ul>'+s.items.map(x=>`<li>${esc(x.title)}: £${Number(x.amount).toLocaleString('en-GB')}</li>`).join('')+'</ul>':''}${s.guardrail?`<p class="muted">${esc(s.guardrail)}</p>`:''}</section>`).join('')}<section class="card"><h2>Keep these three ideas separate</h2><p><b>Tax code</b> = the payroll instruction.</p><p><b>IYA/IYAR</b> = a current-year collection mechanism for extra tax identified during the year.</p><p><b>Underpayment</b> = the amount of tax not yet collected after comparing tax due with tax actually paid.</p><p class="muted">${esc(r.guardrail)}</p></section>`};</script></body></html>
