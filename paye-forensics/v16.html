<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v16 - First Payslip Watch</title><style>body{font-family:system-ui;background:#0B0B0D;color:#F4F1EA;margin:0;padding:24px}main{max-width:960px;margin:auto}.card{border:1px solid #34343a;border-radius:18px;padding:18px;margin:14px 0;background:#151519}.gold{color:#C6A15B}.warn{color:#e0a24a}.ok{color:#83b88c}input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #3b3b42;background:#111114;color:#F4F1EA}button{background:#C6A15B;color:#0B0B0D;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.milestone{padding:12px;border-radius:12px;background:#202026}.finding{padding:12px;border-left:4px solid #C98A3D;background:#1d1d22;margin:8px 0}</style></head><body><main><h1>New Job Tax Code Health Check <span class="gold">v16</span></h1><p>Track the first 35 days after starting a job. This is a risk check, not proof that payroll or HMRC made an error.</p><div class="card grid"><label>Start date<input id="start" type="date"></label><label>Current date<input id="current" type="date"></label><label>First payslip code<input id="paycode" placeholder="e.g. 1257L, BR, 0T M1"></label><label>HMRC current code<input id="hmrccode" placeholder="optional"></label><label>Another live job?<select id="other"><option value="false">No</option><option value="true">Yes</option></select></label><label>P45 given?<select id="p45"><option value="true">Yes</option><option value="false">No</option></select></label><label>Starter declaration<select id="decl"><option value="">Unknown / none</option><option>A</option><option>B</option><option>C</option></select></label><label>Known HMRC-issued code?<select id="known"><option value="false">No / unsure</option><option value="true">Yes</option></select></label></div><button id="run">Run 35-day watch</button><div id="out"></div></main><script type="module">import{buildFirstPayslipWatch}from'./v16-first-payslip-watch.js';const q=id=>document.getElementById(id);q('current').value=new Date().toISOString().slice(0,10);q('run').onclick=()=>{const r=buildFirstPayslipWatch({startDate:q('start').value,currentDate:q('current').value,firstPayslipCode:q('paycode').value,hmrcCurrentCode:q('hmrccode').value,anotherLiveJob:q('other').value==='true',starterDeclaration:q('decl').value,p45Provided:q('p45').value==='true',hmrcCodeKnown:q('known').value==='true'});q('out').innerHTML=`<div class="card"><h2>Day ${r.day}: ${r.phase}</h2><p><strong>Next:</strong> ${r.nextAction}</p><div class="grid">${r.milestones.map(m=>`<div class="milestone"><strong>Day ${m.day}</strong><br>${m.status}</div>`).join('')}</div></div><div class="card"><h2>Risk signals</h2>${r.findings.length?r.findings.map(f=>`<div class="finding"><strong>${f.severity.toUpperCase()}</strong><br>${f.text}</div>`).join(''):'<p class="ok">No configured risk signal triggered from the information entered.</p>'}</div>`};</script></body></html>
