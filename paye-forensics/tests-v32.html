<!doctype html><html><head><meta charset="utf-8"><title>PAYE Forensics v32 tests</title></head><body><pre id="out"></pre><script type="module">import{createCaptureCandidate,editCaptureCandidate,confirmCaptureCandidate,rejectCaptureCandidate}from'./document-capture-gate-v32.js';import{buildConfirmedSourceSet}from'./multi-source-capture-v31.js';const results=[];const t=(name,ok)=>results.push(`${ok?'PASS':'FAIL'} ${name}`);
let c=createCaptureCandidate({id:'p1',documentType:'payslip',documentLabel:'May payslip',fields:{label:'Pension 1',type:'private-pension',annualIncome:'£4,200',taxCode:'300L',taxDeducted:'120'}});t('candidate starts unconfirmed',c.evidenceClass==='UNCONFIRMED');let set=buildConfirmedSourceSet({sources:[{...c.fields,id:c.id,confirmed:false}]});t('unconfirmed excluded from deterministic totals',set.totals.privatePension===0&&set.confirmed.length===0);let r=confirmCaptureCandidate(c);t('complete candidate can be promoted',r.ok&&r.source.confirmed&&r.source.evidenceLabel.includes('May payslip'));set=buildConfirmedSourceSet({sources:[r.source]});t('confirmed document fact enters totals',set.totals.privatePension===4200&&set.totals.taxAlreadyDeducted===120);let bad=createCaptureCandidate({fields:{label:'Job 2',type:'employment',annualIncome:'9000'}});t('missing code/tax cannot silently promote',confirmCaptureCandidate(bad).ok===false);bad=editCaptureCandidate(bad,{taxCode:'BR',taxDeducted:'900'});t('customer edit enables explicit confirmation',confirmCaptureCandidate(bad).ok===true);let rejected=rejectCaptureCandidate(c);t('rejected candidate cannot promote',confirmCaptureCandidate(rejected).ok===false);out.textContent=results.join('\n')+`\n\n${results.every(x=>x.startsWith('PASS'))?'ALL PASS':'CHECK FAILURES'}`;</script></body></html>
