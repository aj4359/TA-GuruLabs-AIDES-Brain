<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYE Forensics v26 | Simple Mode</title><style>body{margin:0;background:#0B0B0D;color:#F4F1EA;font:18px system-ui;line-height:1.5}.wrap{max-width:900px;margin:auto;padding:26px}.gold{color:#C6A15B}.card{background:#121216;border:1px solid #343238;border-radius:22px;padding:22px;margin:18px 0}.emoji{font-size:42px}.pill{display:inline-block;padding:5px 10px;border:1px solid #555;border-radius:999px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-size:14px;color:#c9c4ba}input{width:100%;box-sizing:border-box;background:#0B0B0D;color:#fff;border:1px solid #555;border-radius:10px;padding:11px;margin-top:5px}button{background:#C6A15B;border:0;border-radius:12px;padding:13px 17px;font-weight:800;font-size:16px}.muted{color:#b9b4aa}.big{font-size:clamp(34px,7vw,64px);font-weight:800}</style></head><body><main class="wrap"><span class="pill">PAYE FORENSICS v26 · SIMPLE MODE</span><h1>Explain my tax like I’m <span class="gold">five</span>.</h1><p class="muted">No jargon. No scary tax-code language. Same underlying evidence and calculations, simpler words.</p><section class="grid"><div class="card"><label>Tax code<input id="code" value="K154 M1"></label></div><div class="card"><label>IYA amount £<input id="iya" type="number" value="640"></label></div><div class="card"><label>Underpayment £<input id="under" type="number" value="640"></label></div></section><button id="run">Explain it simply</button><div id="out"></div></main><script type="module">import{buildSimpleExplanation}from'./simple-mode-v26.js';const code=document.querySelector('#code'),iya=document.querySelector('#iya'),under=document.querySelector('#under'),out=document.querySelector('#out');document.querySelector('#run').onclick=()=>{const r=buildSimpleExplanation({taxCode:code.value,iyaAmount:+iya.value,underpayment:+under.value,reasons:[{title:'State Pension'},{title:'Savings interest'},{title:'Earlier tax owed'}]});out.innerHTML=`<section class="card"><div class="big">${r.oneLine}</div></section>`+r.cards.map(c=>`<section class="card"><div class="emoji">${c.emoji}</div><h2>${c.title}</h2><p>${c.text}</p>${c.items?'<ul>'+c.items.map(i=>`<li>${i}</li>`).join('')+'</ul>':''}</section>`).join('')+`<section class="card muted">${r.guardrail}</section>`;};</script></body></html>
