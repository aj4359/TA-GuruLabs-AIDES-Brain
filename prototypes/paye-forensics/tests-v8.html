<!doctype html><html><head><meta charset="utf-8"><title>PAYE Forensics v8 tests</title></head><body><pre id="out"></pre><script src="rules-2026-27.js"></script><script src="engine-v2.js"></script><script src="capture-assist-v6.js"></script><script src="case-adapter-v7.js"></script><script src="iya-model-v8.js"></script><script src="privacy-export-v8.js"></script><script>const out=document.getElementById('out'),rows=[];function test(name,fn){try{fn();rows.push('PASS '+name)}catch(e){rows.push('FAIL '+name+' — '+e.message)}}function ok(v,m){if(!v)throw new Error(m||'assertion failed')}test('W1 marker is observed non-cumulative evidence',()=>{const x=PAYEIYAModelV8.analyse({newTaxCode:'1129L W1',oldTaxCode:'1257L',hmrcStatedUnderpayment:640,remainingPayPeriods:8},{});ok(x.observedNonCum===true);ok(x.conclusions.some(c=>c.id==='noncum-observed'&&c.type==='Inferred'))});test('Lower numeric code without W1 is not asserted as observed non-cumulative',()=>{const x=PAYEIYAModelV8.analyse({newTaxCode:'1129L',oldTaxCode:'1257L',hmrcStatedUnderpayment:640,remainingPayPeriods:8},{});ok(x.observedNonCum===false);ok(x.conclusions.some(c=>c.id==='lower-code-w1m1-possible'&&c.type==='Illustrative'))});test('Equal spread is explicitly illustrative',()=>{const x=PAYEIYAModelV8.analyse({newTaxCode:'1129L',hmrcStatedUnderpayment:640,remainingPayPeriods:8},{});const c=x.conclusions.find(c=>c.id==='equal-spread-visual');ok(c&&c.type==='Illustrative');ok(c.value===80)});test('No equal spread when no pay periods supplied',()=>{const x=PAYEIYAModelV8.analyse({hmrcStatedUnderpayment:640,remainingPayPeriods:0},{});ok(!x.conclusions.some(c=>c.id==='equal-spread-visual'))});test('Privacy export redacts sensitive-looking keys',()=>{const b=PAYEPrivacyExportV8.redactObject({name:'Alice',niNumber:'AB123456C',nested:{address:'1 Road'},safe:42});ok(b.name==='[REDACTED]'&&b.niNumber==='[REDACTED]'&&b.nested.address==='[REDACTED]'&&b.safe===42)});test('Share bundle excludes extraction confidence by default',()=>{const full={result:{taxYear:'2026/27',jurisdiction:'England & Northern Ireland',hmrcStatedUnderpayment:640,reconstructedUnderpayment:637,difference:3,confidence:'Likely explanation',warnings:[],scenarios:[]},evidenceLedger:{observed:[{fieldId:'taxCode',value:'1129L',extractionConfidence:.96}],inferred:[],illustrative:[]},provenance:{}};const b=PAYEPrivacyExportV8.buildShareBundle(full);ok(!('extractionConfidence' in b.evidenceLedger.observed[0]))});test('Share bundle can include audit only by opt-in',()=>{const full={result:{taxYear:'2026/27'},evidenceLedger:{observed:[],inferred:[],illustrative:[]},provenance:{}};ok(!PAYEPrivacyExportV8.buildShareBundle(full).calculationAudit);ok(!!PAYEPrivacyExportV8.buildShareBundle(full,{includeAudit:true}).calculationAudit)});out.textContent=rows.join('\n')+'\n\n'+rows.filter(x=>x.startsWith('PASS')).length+'/'+rows.length+' passed';</script></body></html>
