name: AEGIS Conversation Intelligence

on:
  pull_request:
    paths:
      - 'experiments/aegis-conversation-intelligence/**'
      - '.github/workflows/aegis-conversation-intelligence.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/aegis-conversation-intelligence/**'
      - '.github/workflows/aegis-conversation-intelligence.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run consent and retention policy tests
        working-directory: experiments/aegis-conversation-intelligence
        run: python -m unittest -v
