name: AIDES Trust Control Plane

on:
  pull_request:
    paths:
      - 'aides-trust-control-plane/**'
      - '.github/workflows/aides-trust-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'aides-trust-control-plane/**'
      - '.github/workflows/aides-trust-control-plane.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Trust Control Plane tests
        working-directory: aides-trust-control-plane
        run: python -m unittest -v
      - name: Execute governed transaction proof
        working-directory: aides-trust-control-plane
        run: python demo.py
