name: AIDES OS queue tests
on:
  pull_request:
    paths:
      - 'runtime/**'
      - '.github/workflows/aides-os-queue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s runtime -p 'test_*.py' -v
