name: AIDES Harness v1 Tests
on:
  push:
    paths:
      - 'harness/**'
      - '.github/workflows/aides-harness-tests.yml'
  pull_request:
    paths:
      - 'harness/**'
      - '.github/workflows/aides-harness-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute harness unit tests
        run: python -m unittest discover -s harness -p 'test_*.py' -v
      - name: Verify repository example
        run: python -m harness.runner harness/examples/brain-readme.json --state-dir .aides/state
      - name: Publish evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aides-harness-evidence
          path: .aides/state/
          retention-days: 30
          if-no-files-found: ignore
