name: Retail Opportunity Desk (research only)
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 1-5'
  pull_request:
    paths:
      - 'retail_desk/**'
      - '.github/workflows/retail-opportunity-desk.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic tests
        run: cd retail_desk && python -m unittest -v test_scout.py test_prioritize.py
      - name: Fetch public feeds (scheduled and manual only)
        if: github.event_name != 'pull_request'
        run: python retail_desk/scout.py retail_desk/output/latest.json
      - name: Rank researched evidence cards (scheduled and manual only)
        if: github.event_name != 'pull_request'
        run: python retail_desk/prioritize.py retail_desk/opportunities.json retail_desk/output/priorities.json
      - name: Archive reports (scheduled and manual only)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: retail-opportunity-leads-${{ github.run_number }}
          path: |
            retail_desk/output/latest.json
            retail_desk/output/priorities.json
          retention-days: 30
          if-no-files-found: error
